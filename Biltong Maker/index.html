<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Progress Bar</title>

    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>

<body>
    <div class="controls">
        <div class="control">
            <input
                type="range"
                min="0.01"
                max="100.5"
                value="65"
                class="slider"
                id="slider1">
        </div>

        <div class="control">
            <input
                type="range"
                min="0.01"
                max="100.5"
                value="40"
                class="slider"
                id="slider2">
        </div>
    </div>
    
    <div class="controlsMin">
        <div class="control">
            <input
                type="range"
                min="0.01"
                max="100.5"
                value="65"
                class="slider"
                id="slider1-2">
        </div>

        <div class="control">
            <input
                type="range"
                min="0.01"
                max="100.5"
                value="40"
                class="slider"
                id="slider2-2">
        </div>
    </div>
    
    <div class="controlsMin">
        <div class="control">
            <input
                type="range"
                min="0.01"
                max="100.5"
                value="65"
                class="slider"
                id="slider1-3">
        </div>

        <div class="control">
            <input
                type="range"
                min="0.01"
                max="100.5"
                value="40"
                class="slider"
                id="slider2-3">
        </div>
    </div>

    <div class="bars">
        <div class="main-progress">
            <div class="skill" data-index="0">

                <div class="outer">
                    <div class="inner">
                        <div class="number">65%</div>
                    </div>
                </div>

                <svg class="progress-svg" xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="GradientColor1">
                            <stop offset="0%" stop-color="#b941d3"/>
                            <stop offset="100%" stop-color="#511788"/>
                        </linearGradient>
                    </defs>

                    <circle
                        cx="100"
                        cy="100"
                        r="75"
                        stroke-linecap="round"
                        stroke="url(#GradientColor1)"/>
                </svg>
				
				<svg class="safe-svg" xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="GradientColorSafe1">
                            <stop offset="0%" stop-color="#22ff35"/>
                            <stop offset="100%" stop-color="#27843c"/>
                        </linearGradient>
                    </defs>

                    <circle
						cx="100"
						cy="100"
						r="85"
						stroke-linecap="round"
						stroke="url(#GradientColorSafe1)"/>
                </svg>
            </div>
            
            <div class="progressControls">
                <button class="upMax">up max</button>
                <button class="downMax">down max</button>
                <button class="upMin">up min</button>
                <button class="downMin">down min</button>
            </div>
        </div>

        <div class="main-progress">         
            <div class="skill" data-index="1"> 
                <div class="outer">
                    <div class="inner">
                        <div class="number">40%</div>
                    </div>
                </div>

                <svg class="progress-svg" xmlns="http://www.w3.org/2000/svg"
                     width="200" height="200" viewBox="0 0 200 200">

                    <defs>
                        <linearGradient id="GradientColor2">
                            <stop offset="0%" stop-color="#22d3ee"/>
                            <stop offset="100%" stop-color="#2563eb"/>
                        </linearGradient>
                    </defs>

                    <circle
                        cx="100"
                        cy="100"
                        r="75"
                        stroke-linecap="round"
                        stroke="url(#GradientColor2)"/>
                </svg>

                <svg class="safe-svg" xmlns="http://www.w3.org/2000/svg"
                     width="200" height="200" viewBox="0 0 200 200">

                    <defs>
                        <linearGradient id="GradientColorSafe2">
                            <stop offset="0%" stop-color="#22ff35"/>
                            <stop offset="100%" stop-color="#27843c"/>
                        </linearGradient>
                    </defs>

                    <circle
                        cx="100"
                        cy="100"
                        r="85"
                        stroke-linecap="round"
                        stroke="url(#GradientColorSafe2)"/>
                </svg>
            </div>
            
            <div class="progressControls">
                <button class="upMax">up max</button>
                <button class="downMax">down max</button>
                <button class="upMin">up min</button>
                <button class="downMin">down min</button>
            </div>
        </div>
    </div>
</body>
</html>
