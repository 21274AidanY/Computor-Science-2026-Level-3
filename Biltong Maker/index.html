 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Progress Bar</title>
<!-- HAN COMMENT - what are the stylesheet and javascript links for & what does defer do for when the javascript file is read vs html file - HAN COMMENT -->
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>

<body>
    <h1>Biltong Maker</h1>
    <br>
    <div class="dashboard">
        <!-- HAN COMMENT - either a big comment here explaining the bars or several to explain the main-progress sections - HAN COMMENT -->
        <div class="bars">
            <div class="main-progress">
                <div class="progress-content">
                    <h2 class="progress-title">Temperature</h2>
                    
                    <div class="range-display" id="temp-range">
                        50% – 65%
                    </div>

                    <div class="skill" data-index="0">

                        <div class="outer">
                            <div class="inner">
                                <div class="number">65%</div>
                            </div>
                        </div>

                        <svg class="progress-svg" xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
                            <defs>
                                <linearGradient id="GradientColor1">
                                    <stop offset="0%" stop-color="#b941d3"/>
                                    <stop offset="100%" stop-color="#511788"/>
                                </linearGradient>
                            </defs>

                            <circle
                                cx="100"
                                cy="100"
                                r="75"
                                stroke-linecap="round"
                                stroke="url(#GradientColor1)"/>
                        </svg>


                        <svg class="safe-svg" xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
                            <defs>
                                <linearGradient id="GradientColorSafe1">
                                    <stop offset="0%" stop-color="#22ff35"/>
                                    <stop offset="100%" stop-color="#27843c"/>
                                </linearGradient>
                            </defs>

                            <circle
                                cx="100"
                                cy="100"
                                r="85"
                                stroke-linecap="round"
                                stroke="url(#GradientColorSafe1)"/>
                        </svg>
                    </div>  
                </div>

                <div class="progressControls">
                    <button class="upMax">up max</button>
                    <button class="downMax">down max</button>
                    <button class="upMin">up min</button>
                    <button class="downMin">down min</button>
                </div>
            </div>

            <div class="main-progress">
                <div class="progress-content">
                    <h2 class="progress-title">Humidity</h2>

                    <div class="range-display" id="humidity-range">
                        50% – 65%
                    </div>

                    <div class="skill" data-index="1">
                        <div class="outer">
                            <div class="inner">
                                <div class="number">40%</div>
                            </div>
                        </div>

                        <svg class="progress-svg" xmlns="http://www.w3.org/2000/svg"
                             width="200" height="200" viewBox="0 0 200 200">
                            <defs>
                                <linearGradient id="GradientColor2">
                                    <stop offset="0%" stop-color="#22d3ee"/>
                                    <stop offset="100%" stop-color="#2563eb"/>
                                </linearGradient>
                            </defs>

                            <circle
                                cx="100"
                                cy="100"
                                r="75"
                                stroke-linecap="round"
                                stroke="url(#GradientColor2)"/>
                        </svg>

                        <svg class="safe-svg" xmlns="http://www.w3.org/2000/svg"
                             width="200" height="200" viewBox="0 0 200 200">
                            <defs>
                                <linearGradient id="GradientColorSafe2">
                                    <stop offset="0%" stop-color="#22ff35"/>
                                    <stop offset="100%" stop-color="#27843c"/>
                                </linearGradient>
                            </defs>

                            <circle
                                cx="100"
                                cy="100"
                                r="85"
                                stroke-linecap="round"
                                stroke="url(#GradientColorSafe2)"/>
                        </svg>
                    </div>
                </div>

                <div class="progressControls">
                    <button class="upMax">up max</button>
                    <button class="downMax">down max</button>
                    <button class="upMin">up min</button>
                    <button class="downMin">down min</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="bottom-controls">
        <div class="toggle-section">
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-trigger" checked>
                <span class="slider"></span>
            </label>

            <div>
                <h4>OFF/ON</h4>
                <h6>Turn off all automatic temperature and humidity managers</h6>
            </div>
        </div>

        <a href="usermanual.html">Go to the user manual</a>
    </div>
    
</body>
</html>
