<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Radial Progress Bar</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body> 
	<div class="controls">
		<div class="control">
			<input type="range" min="0.01" max="100.5" value="65" class="slider" id="slider1">
		</div>
		<div class="control">
			<input type="range" min="0.01" max="100.5" value="40" class="slider" id="slider2">
		</div>
	</div>

	<div class="bars">
		<div class="progressbar">
			Temp:
			<div class="skill" data-index="0">
				<div class="outer">
					<div class="inner">
						<div class="number">65%</div>
					</div>
				</div>
				<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="160px" height="160px">
					<defs>
						<linearGradient id="GradientColor1">
							<stop offset="0%" stop-color="#DA22FF"/>
							<stop offset="100%" stop-color="#9733EE"/>
						</linearGradient>
					</defs>
					<circle cx="80" cy="80" r="70" stroke-linecap="round" stroke="url(#GradientColor1)"/>
				</svg>
			</div>
		</div>
		
		<div class="progressbar">
			Humidty:
			<div class="skill" data-index="1">
				<div class="outer">
					<div class="inner">
						<div class="number">40%</div>
					</div>
				</div>
				<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="160px" height="160px">
					<defs>
						<linearGradient id="GradientColor2">
							<stop offset="0%" stop-color="#22d3ee"/>
							<stop offset="100%" stop-color="#2563eb"/>
						</linearGradient>
					</defs>
					<circle cx="80" cy="80" r="70" stroke-linecap="round" stroke="url(#GradientColor2)"/>
				</svg>
			</div>
		</div>
	</div>
</body>
</html>
