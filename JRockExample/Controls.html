<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, intial-scale=1.0" />
        <title>J Rocket Controls</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js"></script>
    </head>
    <body>
        <header>
            <h1 class="title">J Rocket Orbital - Controls</h1>
            <nav>
                <a href="index.html">Information</a>
            </nav>
        </header>
        <div class=container>
            <br>
            
            <form id="launch" action="/" method="get">
                <input type="submit" value="Launch">
            </form>
           
            <br>

            <form id="target">
                <input type="radio" id="target1" name="target" value="Moon0"/>
                <label for="target1">Moon</label><br />
                <input type="radio" id="target2" name="target" value="Mars"/>
                <label for="target2">Mars</label><br />
                <input type="radio" id="target3" name="target" value="Uranus"/>
                <label for="target3">Uranus</label><br />
                <Input type="submit"  value="Go" />
            </form>
            <form id="FTS">
                <Input type="submit"  value="FTS" />
            </form>
           
            <P id="launchVal">launch</P>
            <P id="targetVal">target</P>
            <P id="FTSVal">FTS</P>
        </div>
       
        <br>
    <footer>Factory War Game Prototype (Realsing in 2042)</footer>
    </body>
</html>
